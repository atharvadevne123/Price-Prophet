version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: price-prophet:latest
    container_name: price-prophet-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/prices.db"
      MODEL_PATH: "/models/price_model.pkl"
      METRICS_PATH: "/models/metrics.json"
      LOG_LEVEL: "INFO"
    volumes:
      - model_data:/models
      - db_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  model_data:
    driver: local
  db_data:
    driver: local
